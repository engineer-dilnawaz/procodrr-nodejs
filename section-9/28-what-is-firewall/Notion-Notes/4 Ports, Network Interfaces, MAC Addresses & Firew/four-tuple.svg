<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d">
<title id="t">How one server port serves many clients at once</title>
<desc id="d">A laptop, a phone and a tablet each connect to the same server on port 443. The operating system of each client gives it a random ephemeral port, such as 63813, 51022 and 49890. Every connection is named by four values: client IP, client port, server IP and server port, so all three connections to port 443 stay different.</desc>
<style>
  text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: Consolas, "Cascadia Mono", Menlo, monospace; }
  .zone { font-size: 12px; font-weight: 800; letter-spacing: .6px; }
  .name { font-size: 14px; font-weight: 800; }
  .sub { font-size: 11.5px; fill: #94a3b8; }
  .cap { font-size: 15px; fill: #f1f5f9; text-anchor: middle; opacity: 0; }
  .c1 { animation: c1 10s steps(1, end) infinite; }
  .c2 { animation: c2 10s steps(1, end) infinite; }
  .c3 { animation: c3 10s steps(1, end) infinite; }
  .c4 { animation: c4 10s steps(1, end) infinite; }
  @keyframes c1 { 0% { opacity: 1; } 25% { opacity: 0; } }
  @keyframes c2 { 0% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes c3 { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0; } }
  @keyframes c4 { 0% { opacity: 0; } 75% { opacity: 1; } 98% { opacity: 0; } }
  .l1 { animation: l1 10s steps(1, end) infinite; }
  .l2 { animation: l2 10s steps(1, end) infinite; }
  .l3 { animation: l3 10s steps(1, end) infinite; }
  @keyframes l1 { 0% { stroke: #fbbf24; stroke-width: 3; } 25% { stroke: #334155; stroke-width: 1.5; } 75% { stroke: #4ade80; stroke-width: 3; } 98% { stroke: #fbbf24; stroke-width: 3; } }
  @keyframes l2 { 0% { stroke: #334155; stroke-width: 1.5; } 25% { stroke: #60a5fa; stroke-width: 3; } 50% { stroke: #334155; stroke-width: 1.5; } 75% { stroke: #4ade80; stroke-width: 3; } 98% { stroke: #334155; stroke-width: 1.5; } }
  @keyframes l3 { 0% { stroke: #334155; stroke-width: 1.5; } 50% { stroke: #a78bfa; stroke-width: 3; } 75% { stroke: #4ade80; stroke-width: 3; } 98% { stroke: #334155; stroke-width: 1.5; } }
  .a3 { opacity: 0; animation: a3 10s steps(1, end) infinite; }
  @keyframes a3 { 0% { opacity: 0; } 3% { opacity: 1; } 98% { opacity: 0; } }
  .a10 { opacity: 0; animation: a10 10s steps(1, end) infinite; }
  @keyframes a10 { 0% { opacity: 0; } 10% { opacity: 1; } 98% { opacity: 0; } }
  .a17 { opacity: 0; animation: a17 10s steps(1, end) infinite; }
  @keyframes a17 { 0% { opacity: 0; } 17% { opacity: 1; } 98% { opacity: 0; } }
  .a24 { opacity: 0; animation: a24 10s steps(1, end) infinite; }
  @keyframes a24 { 0% { opacity: 0; } 24% { opacity: 1; } 98% { opacity: 0; } }
  .a27 { opacity: 0; animation: a27 10s steps(1, end) infinite; }
  @keyframes a27 { 0% { opacity: 0; } 27% { opacity: 1; } 98% { opacity: 0; } }
  .a34 { opacity: 0; animation: a34 10s steps(1, end) infinite; }
  @keyframes a34 { 0% { opacity: 0; } 34% { opacity: 1; } 98% { opacity: 0; } }
  .a41 { opacity: 0; animation: a41 10s steps(1, end) infinite; }
  @keyframes a41 { 0% { opacity: 0; } 41% { opacity: 1; } 98% { opacity: 0; } }
  .a52 { opacity: 0; animation: a52 10s steps(1, end) infinite; }
  @keyframes a52 { 0% { opacity: 0; } 52% { opacity: 1; } 98% { opacity: 0; } }
  .a58 { opacity: 0; animation: a58 10s steps(1, end) infinite; }
  @keyframes a58 { 0% { opacity: 0; } 58% { opacity: 1; } 98% { opacity: 0; } }
  .a64 { opacity: 0; animation: a64 10s steps(1, end) infinite; }
  @keyframes a64 { 0% { opacity: 0; } 64% { opacity: 1; } 98% { opacity: 0; } }
  .a70 { opacity: 0; animation: a70 10s steps(1, end) infinite; }
  @keyframes a70 { 0% { opacity: 0; } 70% { opacity: 1; } 98% { opacity: 0; } }
  .a77 { opacity: 0; animation: a77 10s steps(1, end) infinite; }
  @keyframes a77 { 0% { opacity: 0; } 77% { opacity: 1; } 98% { opacity: 0; } }
</style>
<rect width="800" height="360" rx="18" fill="#0f172a"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#e5e7eb">One server port, many connections</text>
<rect class="l1" x="24" y="50" width="752" height="72" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
<text class="name" x="40" y="80" fill="#fcd34d">Clients</text><text class="sub" x="40" y="100">random ephemeral ports</text>
<rect class="l2" x="24" y="130" width="752" height="72" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
<text class="name" x="40" y="160" fill="#93c5fd">One server port</text><text class="sub" x="40" y="180">443 serves them all</text>
<rect class="l3" x="24" y="210" width="752" height="72" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
<text class="name" x="40" y="240" fill="#c4b5fd">Four values</text><text class="sub" x="40" y="260">name each connection</text>
<g class="a3"><rect x="190" y="72" width="140" height="28" rx="6" fill="#422006" stroke="#ca8a04" stroke-width="1.5"/><text class="mono" x="260.0" y="90.32" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">laptop :63813</text></g>
<g class="a10"><rect x="340" y="72" width="140" height="28" rx="6" fill="#422006" stroke="#ca8a04" stroke-width="1.5"/><text class="mono" x="410.0" y="90.32" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">phone :51022</text></g>
<g class="a17"><rect x="490" y="72" width="140" height="28" rx="6" fill="#422006" stroke="#ca8a04" stroke-width="1.5"/><text class="mono" x="560.0" y="90.32" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">tablet :49890</text></g>
<g class="a24"><text x="646" y="91" font-size="11.5" font-weight="800" fill="#94a3b8">random ports</text></g>
<g class="a27"><rect x="190" y="152" width="170" height="28" rx="6" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/><text class="mono" x="275.0" y="170.32" font-size="12" font-weight="700" fill="#bfdbfe" text-anchor="middle">203.0.113.10:443</text></g>
<g class="a34"><text x="372" y="171" font-size="12" font-weight="800" fill="#bfdbfe">one server port</text></g>
<g class="a41"><text x="500" y="171" font-size="12" font-weight="800" fill="#bfdbfe">three connections at once</text></g>
<g class="a52"><rect x="190" y="232" width="98" height="28" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/><text class="mono" x="239.0" y="250.14" font-size="11.5" font-weight="700" fill="#bbf7d0" text-anchor="middle">client IP</text></g>
<g class="a58"><rect x="296" y="232" width="98" height="28" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/><text class="mono" x="345.0" y="250.14" font-size="11.5" font-weight="700" fill="#bbf7d0" text-anchor="middle">client port</text></g>
<g class="a64"><rect x="402" y="232" width="98" height="28" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/><text class="mono" x="451.0" y="250.14" font-size="11.5" font-weight="700" fill="#bbf7d0" text-anchor="middle">server IP</text></g>
<g class="a70"><rect x="508" y="232" width="98" height="28" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/><text class="mono" x="557.0" y="250.14" font-size="11.5" font-weight="700" fill="#bbf7d0" text-anchor="middle">server port</text></g>
<g class="a77"><rect x="622" y="226" width="138" height="40" rx="8" fill="#052e16" stroke="#4ade80" stroke-width="2"/><text x="691.0" y="250.14" font-size="11.5" font-weight="800" fill="#bbf7d0" text-anchor="middle">each set unique</text></g>
<rect x="24" y="294" width="752" height="50" rx="10" fill="#0b1220" stroke="#334155"/>
<text class="cap c1" x="400" y="325">1. Each client gets a random ephemeral port from its own OS</text>
<text class="cap c2" x="400" y="325">2. All of them connect to the same server port, 443</text>
<text class="cap c3" x="400" y="325">3. A connection is named by four values: two IPs and two ports</text>
<text class="cap c4" x="400" y="325">4. The four values differ for every client, so nothing clashes</text>
</svg>
